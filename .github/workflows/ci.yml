name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt black ruff
      - name: Format check (black)
        run: black --check .
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: pytest
