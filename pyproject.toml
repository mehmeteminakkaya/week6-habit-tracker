[project]
name = "week6-habit-tracker"
version = "0.1.0"
description = "Habit tracker with deterministic guardrails and AI-assisted review (Week 6)"
requires-python = ">=3.10"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
testpaths = ["test_main.py", "tests"]
